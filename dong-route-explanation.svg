<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f6f8fc"/>
  <style>
    text { font-family: 'Malgun Gothic','Noto Sans KR',sans-serif; fill:#172235; }
    .title { font-size:34px; font-weight:700; }
    .sub { font-size:19px; fill:#526078; }
    .head { font-size:25px; font-weight:700; }
    .body { font-size:21px; font-weight:600; }
    .small { font-size:17px; fill:#4f5d74; }
    .white { fill:#fff; }
  </style>
  <text x="52" y="62" class="title">행정동 선택과 자동 최적화가 지금 묶여 있는 상태</text>
  <text x="52" y="98" class="sub">방문지 등록이나 담당자 문제가 아니라, 지도를 볼 때의 범위 문제</text>

  <rect x="42" y="132" width="1116" height="255" rx="22" fill="#fff" stroke="#d7dfeb" stroke-width="2"/>
  <rect x="64" y="154" width="122" height="46" rx="14" fill="#ffdfdc"/>
  <text x="88" y="185" class="head" fill="#a52722">지금</text>
  <rect x="85" y="222" width="245" height="91" rx="18" fill="#e5edff"/>
  <text x="115" y="257" class="body">행정동 A 선택</text>
  <text x="115" y="286" class="small">로그인 후 기존 흐름</text>
  <path d="M338 267 H385" stroke="#8b9bb7" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="399" y="222" width="304" height="91" rx="18" fill="#e5edff"/>
  <text x="427" y="257" class="body">A의 그리드·방문지만 표시</text>
  <text x="427" y="286" class="small">다른 동 방문지는 화면에서 빠짐</text>
  <path d="M712 267 H756" stroke="#8b9bb7" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="771" y="222" width="338" height="91" rx="18" fill="#e5edff"/>
  <text x="799" y="257" class="body">A 방문지만 자동 최적화</text>
  <text x="799" y="286" class="small">B를 선택하면 화면·경로가 B로 바뀜</text>
  <text x="84" y="355" class="small">핵심: 행정동 선택 하나가 ‘그리드’, ‘보이는 방문지’, ‘최적화할 방문지’를 전부 결정</text>

  <rect x="42" y="413" width="1116" height="286" rx="22" fill="#fff" stroke="#d7dfeb" stroke-width="2"/>
  <rect x="64" y="435" width="122" height="46" rx="14" fill="#dcf4e6"/>
  <text x="87" y="466" class="head" fill="#17663b">제안</text>
  <rect x="85" y="510" width="245" height="98" rx="18" fill="#e5edff"/>
  <text x="115" y="546" class="body">행정동 A 선택</text>
  <text x="115" y="577" class="small">A 그리드 표시</text>
  <path d="M338 559 H385" stroke="#8b9bb7" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="399" y="510" width="304" height="98" rx="18" fill="#dcf4e6"/>
  <text x="427" y="546" class="body">A 방문지 자동 최적화</text>
  <text x="427" y="577" class="small">기존 로그인 흐름 유지</text>
  <path d="M712 559 H756" stroke="#8b9bb7" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="771" y="510" width="338" height="98" rx="18" fill="#fff0d5"/>
  <text x="799" y="546" class="body">B를 볼 때 B 그리드 표시</text>
  <text x="799" y="577" class="small">A 경로는 유지, B 방문지 추가 가능</text>
  <text x="84" y="665" class="small">행정동 선택은 그리드를 바꾸고, 오늘 경로에 넣은 방문지는 따로 유지한다는 뜻</text>
  <defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#8b9bb7"/></marker></defs>
</svg>
