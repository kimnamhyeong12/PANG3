name: Sahagu Project CI/CD

on:
  push:
    branches: [ "main" ] # main 브랜치에 푸시하면 작동 시작함

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          
          platforms: linux/amd64 
          tags: ${{ secrets.DOCKER_USERNAME }}/sahagu-api:latest

  deploy:
    needs: build-and-push # 빌드가 성공해야 배포를 시작
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      #  매일 바뀌는 실시간 IP를 찾아냄 (우리는 탄력적 ip 안씀)
      - name: Get EC2 Public IP
        id: get-ip
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "ip=$PUBLIC_IP" >> $GITHUB_OUTPUT

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ steps.get-ip.outputs.ip }} # 방금 찾은 따끈따끈한 IP 사용
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/PANG3
            # 최신 설계도(docker-compose.yml) 동기화 (선택사항)
            git pull origin main
            # 새 이미지 내려받고 재시작
            docker-compose pull
            docker-compose up -d
            # 안 쓰는 옛날 이미지는 삭제해서 용량 확보
            docker image prune -f