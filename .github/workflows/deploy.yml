name: Sahagu Project CI/CD (Secure)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64 
          tags: ${{ secrets.DOCKER_USERNAME }}/sahagu-api:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get EC2 Public IP
        id: get-ip
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "ip=$PUBLIC_IP" >> $GITHUB_OUTPUT

      
      - name: Get GitHub Actions IP
        id: ip
        run: echo "ipv4=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT

      
      - name: Add GitHub IP to Security Group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        env:
          VITE_KAKAO_MAP_KEY: ${{ vars.VITE_KAKAO_MAP_KEY }}
        with:
          host: ${{ steps.get-ip.outputs.ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          envs: VITE_KAKAO_MAP_KEY
          script: |
            set -eu
            cd /home/ubuntu/PANG3
            test "$(git branch --show-current)" = "main"
            # Preserve the server's npm-generated lockfile without discarding other edits.
            unexpected_changes="$(git status --porcelain --untracked-files=all | sed '/^ M web\/package-lock.json$/d; /^?? report_latest.hwpx$/d')"
            if [ -n "$unexpected_changes" ]; then
              echo "Server checkout has other local changes; leaving it untouched"
              git status --short
              exit 1
            fi
            if ! git diff --quiet -- web/package-lock.json; then
              backup_dir="/home/ubuntu/deploy-backups/${{ github.run_id }}-${{ github.run_attempt }}"
              mkdir -p "$backup_dir"
              chmod 700 "$backup_dir"
              cp web/package-lock.json "$backup_dir/web-package-lock.json"
              git diff --binary -- web/package-lock.json > "$backup_dir/web-package-lock.patch"
              git restore -- web/package-lock.json
              echo "Server web lockfile backed up to $backup_dir before deployment"
            fi
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              git branch "deploy-backup-${{ github.run_id }}" HEAD
              git reset --hard origin/main
            fi
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
            pull_attempt=1
            until docker compose pull; do
              if [ "$pull_attempt" -ge 3 ]; then
                echo "Docker image pull failed after 3 attempts"
                exit 1
              fi
              echo "Docker image pull failed; retrying in 10 seconds"
              pull_attempt=$((pull_attempt + 1))
              sleep 10
            done
            docker compose up -d
            # Nginx serves the web checkout's dist directory. Rebuild it on every
            # main deployment alongside the API so the browser gets this commit.
            cd web
            npm ci --no-audit --no-fund
            npm run build
            cd ..
            docker image prune -f

      
      - name: Remove GitHub IP from Security Group
        if: always() 
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
