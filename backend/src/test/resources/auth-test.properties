spring.datasource.url=jdbc:h2:mem:releaseauth;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.main.banner-mode=off
fieldwork.auth.cookie-secure=true
fieldwork.auth.public-url=https://example.test
fieldwork.auth.mail-from=no-reply@example.test
logging.level.root=WARN
