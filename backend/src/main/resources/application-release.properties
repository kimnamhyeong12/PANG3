# Set these through SSM/environment on the deployment host. No secrets in Git.
fieldwork.auth.allowed-origins=${FIELDWORK_AUTH_ALLOWED_ORIGINS:}
fieldwork.auth.cookie-secure=true
fieldwork.auth.access-seconds=900
fieldwork.auth.refresh-seconds=7776000
fieldwork.auth.public-url=${FIELDWORK_AUTH_PUBLIC_URL:}
fieldwork.auth.mail-from=${FIELDWORK_AUTH_MAIL_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
