# Standalone local test configuration. Start with spring.config.location pointing
# directly at this file, so the normal application.yml/AWS import is never read.
server.address=0.0.0.0
server.port=18081
spring.config.import=
spring.datasource.url=jdbc:postgresql://127.0.0.1:15432/pang3_release_test
spring.datasource.username=pang3_test
spring.datasource.password=local_test_only
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=60MB
fieldwork.auth.cookie-secure=false
fieldwork.auth.allowed-origins=http://localhost:5173,http://localhost:4173
fieldwork.auth.access-seconds=900
fieldwork.auth.refresh-seconds=7776000
fieldwork.upload.base-dir=./backend/target/release-local/uploads
fieldwork.ai.output-dir=./backend/target/release-local/reports
fieldwork.ai.script-path=./ai/app.py
fieldwork.ai.python-path=python
fieldwork.auth.mail-from=
fieldwork.auth.public-url=
kakao.rest-api-key=
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
